name: Validar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar metadados, links e catálogo
        run: python scripts/catalogo.py --check
